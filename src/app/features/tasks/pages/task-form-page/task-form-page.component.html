<div class="card">
  <div class="font-semibold text-xl mb-4">
    {{ editMode() ? 'Edit task' : 'Add task' }}
  </div>
  <div class="md:w-1/2">
    <form [formGroup]="TaskFormPageStateService.taskForm">
      <div class="flex flex-col gap-4">
        <div class="flex flex-col gap-2">
          <label>Name</label>
          <input
            pInputText
            type="text"
            [formControl]="TaskFormPageStateService.taskForm.controls.name"
            appFormControlErrorState
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Description</label>
          <input
            pInputText
            type="text"
            [formControl]="TaskFormPageStateService.taskForm.controls.description"
            appFormControlErrorState
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Priority</label>
          <p-select
            [formControl]="TaskFormPageStateService.taskForm.controls.priority"
            [options]="priorities()"
            optionLabel="label"
            optionValue="value"
            placeholder="Select"
            appFormControlErrorState
          />
        </div>
        <div class="flex flex-col gap-2">
          <label>Tags</label>
          <p-multiselect
            #tagSelect
            inputId="tagCodes"
            [options]="tags()"
            optionLabel="label"
            optionValue="value"
            display="chip"
            placeholder="Select tags"
            styleClass="w-full"
            (onChange)="onTagsChange($event.value)"
          >
          </p-multiselect>
        </div>
      </div>
      <div class="flex justify-between mt-4">
        <div>
          <!-- TODO miejsce na przyszłość -->
        </div>
        <div class="flex gap-2">
          <p-button
            [disabled]="editMode()"
            type="button"
            label="Clear"
            severity="secondary"
            icon="pi pi-times"
            (onClick)="onClear()"
          >
          </p-button>

          <p-button type="submit" label="Submit" icon="pi pi-check" (onClick)="onSubmit()">
          </p-button>
        </div>
      </div>
    </form>
  </div>
</div>
<p-dialog
  header="Dialog"
  [visible]="showDialog()"
  [breakpoints]="{ '960px': '75vw' }"
  [style]="{ width: '30vw' }"
  [modal]="true"
>
  <p class="leading-normal m-0">
    {{ dialogMessage() }}
  </p>
  <ng-template #footer>
    <p-button label="Ok" (click)="onClose()" />
  </ng-template>
</p-dialog>
